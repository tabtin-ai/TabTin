[pytest]
# DJANGO_SETTINGS_MODULE 由 root conftest.py 控制：
#   - 默认走 ``tabtin.settings``（``os.environ.setdefault`` 兜底）
#   - 单文件跑 ``settings_*_test.py`` 系列时，``_ISOLATED_SETTINGS_HINTS``
#     自动切到对应的 in-memory SQLite 隔离 settings
# 这里**故意不**声明 ``DJANGO_SETTINGS_MODULE``——pytest-django 的
# ``pytest_load_initial_conftests`` (tryfirst=True) 会在 root conftest import
# 之前读 ini 并主动写入 ``os.environ``，导致 conftest 的覆盖完全失效；
# 留空让 pytest-django 在 ``pytest_configure`` (trylast) 阶段重新 setup。
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts =
    --ignore=backups
    --ignore=scripts
    -m "not requires_prod_db and not requires_agent_fixture and not requires_pg_native and not infra_drift"
markers =
    requires_prod_db: Test needs real MySQL + PostgreSQL (skipped in default CI)
    requires_agent_fixture: Test needs Agent/Space fixture chain via real PG (skipped in default CI)
    requires_pg_native: Test needs real PostgreSQL with native table schema (skipped in default CI)
    infra_drift: Test fixture/mock drifted from current API surface (skipped in default CI)
    slow: Test is slow (> 30s)
