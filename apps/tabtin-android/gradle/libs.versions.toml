[versions]
# Wave A0 chain upgrade (2026-05-03):
# Kotlin 2.0.21 -> 2.3.21, AGP 8.7.3 -> 9.2.0, Gradle wrapper 8.11.1 -> 9.4.1,
# KSP -> 2.3.7 (KSP2 since 2.3.0 decoupled from Kotlin version,
#               2.3.7 is "Bumped Kotlin target language version to 2.3"),
# Hilt 2.53.1 -> 2.59.2 (AGP 9 jetifier bug fixed in 2.59.2, 2.59.0/2.59.1 broken),
# OkHttp 4.12.0 -> 5.3.2 (binary compatible with Retrofit 2.11),
# Compose BOM 2024.12.01 -> 2026.03.00,
# compileSdk/targetSdk 35 -> 36 (Google Play 2026-08-31 policy),
# markdown-renderer 0.33.0 -> 0.39.2 (PITFALLS #12, requires compileSdk=36),
# Room 2.6.1 -> 2.8.4 （强制升：Room 2.6.1 在 KSP2 上有 "unexpected jvm signature V" bug，
#                       Room 2.7.0-alpha11 起修复，2.8.4 当前最新稳定 + 完整 KSP2 支持）.
# Coil/Retrofit/kotlinx-serialization/security-crypto 不动（独立议题）。
# jvmTarget=17 不动（v0.2 §5 取消升 21）。
agp = "9.2.0"
kotlin = "2.3.21"
ksp = "2.3.7"

compose-bom = "2026.03.00"
compose-navigation = "2.8.5"
activity-compose = "1.9.3"
lifecycle = "2.8.7"
work = "2.10.0"
core-ktx = "1.15.0"
webkit = "1.14.0"

hilt = "2.59.2"
hilt-navigation-compose = "1.2.0"

retrofit = "2.11.0"
okhttp = "5.3.2"
kotlinx-serialization = "1.7.3"
retrofit-serialization = "1.0.0"

room = "2.8.4"
coil = "2.7.0"
datastore = "1.1.1"
security-crypto = "1.1.0-alpha06"
appcompat = "1.7.0"
recyclerview = "1.3.2"
splashscreen = "1.0.1"
markdown-renderer = "0.39.2"
chucker = "4.3.1"
sentry = "8.47.0"
# TabChat IM 实时通道 SDK。注：需求书写 0.7.0，但 Maven Central 上该 artifact
# 最新只到 0.5.0（无 0.6.x / 0.7.x），故锁 0.5.0（API 自 0.2.x 起稳定：Client /
# Options.setData / newSubscription(SubscriptionOptions) / EventListener 均一致）。
centrifuge = "0.5.0"
zxing-embedded = "4.3.0"

