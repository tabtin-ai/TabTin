        '200':
          description: 匹配的 App 凭据列表（脱敏，无明文密码）
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AppCredential'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /credential-vault/website/{credential_id}/autofill-reveal:
    post:
      tags: [credential-vault]
      summary: 网站凭据自动填充取明文
      operationId: revealWebsiteCredentialForAutofill
      description: |
        本地 Runtime 的 ``credential_retrieve`` 工具调此端点拿网站密码明文。
        无需用户主密码（仅 JWT 校验），但走独立的速率限制（20 次/5 分钟）。
        D7.2：App 密码采用降级策略，本地 Runtime 不调对应 ``/app/{id}/reveal``。
      parameters:
        - name: credential_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: 网站凭据明文
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebsiteCredentialReveal'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          description: 速率限制
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiEnvelope'
