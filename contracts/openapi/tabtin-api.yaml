  # ═══════════════════ RAG 模块（W13c FC 工具：rag_search） ═══════════════════

  /rag/v2/search:
    post:
      tags: [rag]
      summary: 统一语义检索
      operationId: ragUnifiedSearch
      description: |
        跨内容类型的统一检索入口。本地 Runtime 的 ``rag_search`` 工具是此端点的薄
        wrapper（W13c D7.1）：业务逻辑在 ``apps/rag/services/unified_search_service.py``，
        本地端只做调用 + 透传。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RagSearchRequest'
      responses:
        '200':
          description: 检索结果（直接返回 RagSearchResponse，无 ApiEnvelope 包装）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RagSearchResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  # ═══════════════════ TabMemo 模块（W13c FC 工具：memory_*） ═══════════════════

  /tabmemo/memos/:
    get:
      tags: [tabmemo]
      summary: 列出 memo
      operationId: listTabmemoMemos
      description: |
        本地 Runtime 的 ``memory_search`` 工具调此端点；W13c D7.1 新增 ``source`` 查询参数
        实现 Agent / 用户 memo 隔离——本地 Runtime 必须传 ``source=agent``。
      parameters:
        - name: organization_id
          in: query
          required: true
          schema:
            type: string
        - name: space_id
          in: query
          schema:
            type: string
        - name: search
          in: query
          schema:
            type: string
        - name: tags
          in: query
          schema:
            type: string
        - name: color
          in: query
          schema:
            type: string
        - name: memo_type
          in: query
          schema:
            type: string
        - name: collection_id
          in: query
          schema:
            type: string
        - name: status
          in: query
          schema:
            type: string
            enum: [active, archived, trashed]
            default: active
        - name: sort
          in: query
          schema:
            type: string
            enum: [-created_at, created_at, -updated_at, updated_at]
            default: '-created_at'
        - name: cursor
          in: query
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
        - name: source
          in: query
          description: 'W13c D7.1：来源过滤。agent=仅 Agent 写入；user=排除 Agent；其它枚举（manual/browser/share/api/voice）精确匹配。不传保持兼容。'
          schema:
            type: string
            enum: [agent, user, manual, browser, share, api, voice]
      responses:
        '200':
          description: 列表（success_response 信封 wrap 后即 MemoListResponse）
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/MemoListResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [tabmemo]
      summary: 创建 memo
      operationId: createTabmemoMemo
      description: 本地 Runtime 的 ``memory_write`` 工具调此端点，须传 source='agent'。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MemoCreateRequest'
      responses:
        '201':
          description: 创建成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /tabmemo/memos/{memo_id}/archive/:
    post:
      tags: [tabmemo]
      summary: 归档 memo
      operationId: archiveTabmemoMemo
      description: 本地 Runtime 的 ``memory_delete`` 工具调此端点（语义为归档而非物理删除）。
      parameters:
        - name: memo_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: 归档成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

