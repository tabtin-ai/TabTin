name: tabtin-community

x-django-image: &django-image
  image: tabtin/community-django:local
  build:
    context: .
    dockerfile: apps/tabtin_django/Dockerfile
    args:
      BASE_IMAGE: python:3.11-slim
      INSTALL_PLAYWRIGHT: "true"

x-django-environment: &django-environment
  TABTIN_EDITION: community
  TABTIN_DATABASE_MODE: single_pg
  # This official profile is intentionally localhost-only. Upstream Local
  # Storage rejects loopback download URLs in production mode, so keep the
  # local developer install in Django's loopback-safe development mode.
  DEBUG: "True"
  ALLOW_LAN_HOSTS_IN_DEBUG: "False"
  ENABLE_HTTPS_SECURITY: "false"
  ALLOWED_HOSTS: localhost,127.0.0.1,django
  CSRF_TRUSTED_ORIGINS: http://localhost:6060,http://127.0.0.1:6060
  CORS_ALLOWED_ORIGINS: http://localhost:5175,http://127.0.0.1:5175
  TABTIN_REQUIRE_INVITE_CODE: "false"
  SECRET_KEY_FILE: /run/tabtin-community-secrets/SECRET_KEY
  JWT_SECRET_KEY_FILE: /run/tabtin-community-secrets/JWT_SECRET_KEY
  CREDENTIAL_ENCRYPTION_KEY_FILE: /run/tabtin-community-secrets/CREDENTIAL_ENCRYPTION_KEY
  CENTRIFUGO_API_KEY_FILE: /run/tabtin-community-secrets/CENTRIFUGO_API_KEY
  CENTRIFUGO_PROXY_SECRET_FILE: /run/tabtin-community-secrets/CENTRIFUGO_PROXY_SECRET
  CENTRIFUGO_TOKEN_SECRET_FILE: /run/tabtin-community-secrets/CENTRIFUGO_TOKEN_SECRET
  PG_DB_NAME: tabtin
  PG_DB_USER: tabtin_runtime
  PG_DB_PASSWORD_FILE: /run/tabtin-community-secrets/PG_RUNTIME_PASSWORD
  PG_DB_HOST: postgres
  PG_DB_PORT: "5432"
  REDIS_URL: redis://redis:6379/0
  REDIS_CACHE_URL: redis://redis:6379/1
  REDIS_CHANNEL_URL: redis://redis:6379/2
  CELERY_BROKER_URL: redis://redis:6379/0
  CENTRIFUGO_API_URL: http://centrifugo:8100/api
  SERVICES_SMS_PROVIDER: disabled
  SERVICES_EMAIL_PROVIDER: disabled
  EMAIL_BACKEND: django.core.mail.backends.console.EmailBackend
  SERVICES_OSS_PROVIDER: local
  LOCAL_OSS_BUCKET_NAME: tabtin-community-local
  LOCAL_OSS_ROOT: /var/lib/tabtin/objects
  TABTIN_PUBLIC_BASE_URL: http://127.0.0.1:6060
  ENABLE_JINBAO_BOT: "false"
  SEARCH_ENGINE_ENABLED: "false"
  RAG_ENABLED: "false"
  RUN_MIGRATIONS: "false"
  RUN_BOOTSTRAP: "false"
  LOG_TO_FILE: "false"

services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    entrypoint: ["/usr/local/bin/community-postgres-entrypoint.sh"]
    command: ["postgres"]
    environment:
      POSTGRES_DB: tabtin
      POSTGRES_USER: tabtin_init
      POSTGRES_PASSWORD_FILE: /run/tabtin-community-secrets/PG_INIT_PASSWORD
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - installation-secrets:/run/tabtin-community-secrets
      - ./community-assets/postgres-entrypoint.sh:/usr/local/bin/community-postgres-entrypoint.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tabtin_init -d tabtin"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    networks: [community]

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [community]

  django:
    <<: *django-image
    user: "0:0"
    restart: unless-stopped
    command: ["community-web"]
    environment:
      <<: *django-environment
      TABTIN_COMMUNITY_SECRET_ROOT: /run/tabtin-community-secrets
      PG_INIT_PASSWORD_FILE: /run/tabtin-community-secrets/PG_INIT_PASSWORD
      PG_MIGRATOR_PASSWORD_FILE: /run/tabtin-community-secrets/PG_MIGRATOR_PASSWORD
      PG_RUNTIME_PASSWORD_FILE: /run/tabtin-community-secrets/PG_RUNTIME_PASSWORD
      TABTIN_COMMUNITY_DATABASE_SQL_ROOT: /app/community-assets/postgres
      TABTIN_COMMUNITY_RUNTIME_UID: "10001"
      TABTIN_COMMUNITY_RUNTIME_GID: "10001"
      TABTIN_COMMUNITY_POSTGRES_UID: "999"
      TABTIN_COMMUNITY_POSTGRES_GID: "999"
      TABTIN_COMMUNITY_CENTRIFUGO_TEMPLATE: /app/community-assets/centrifugo.template.json
    volumes:
      - installation-secrets:/run/tabtin-community-secrets
      - local-objects:/var/lib/tabtin/objects
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    ports:
      - "127.0.0.1:6060:6060"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:6060/health/ready >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 180s
    networks: [community]

  celery:
    <<: *django-image
    user: "10001:10001"
    restart: unless-stopped
    command: ["worker"]
    environment:
      <<: *django-environment
      CELERY_QUEUES: default,critical
      CELERY_CONCURRENCY: "2"
      CELERY_PREFETCH_MULTIPLIER: "1"
      CELERY_MAX_MEMORY: "700000"
    volumes:
      - installation-secrets:/run/tabtin-community-secrets:ro
      - local-objects:/var/lib/tabtin/objects
    depends_on:
      django: {condition: service_healthy}
      redis: {condition: service_healthy}
    healthcheck:
      test: ["CMD-SHELL", "celery -A tabtin inspect ping -d celery@$$HOSTNAME --timeout=5 | grep -q pong"]
      interval: 20s
      timeout: 10s
      retries: 6
      start_period: 60s
    networks: [community]

  centrifugo:
    image: centrifugo/centrifugo:v6
    user: "10001:10001"
    restart: unless-stopped
    command: ["centrifugo", "-c", "/run/tabtin-community-secrets/centrifugo.json", "-p", "8100"]
    volumes:
      - installation-secrets:/run/tabtin-community-secrets:ro
    depends_on:
      django: {condition: service_healthy}
      redis: {condition: service_healthy}
    ports:
      - "127.0.0.1:8100:8100"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8100/health >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    networks: [community]

networks:
  community:
    name: tabtin-community
    driver: bridge

volumes:
  postgres-data:
    name: tabtin-community-postgres-data
  redis-data:
    name: tabtin-community-redis-data
  installation-secrets:
    name: tabtin-community-installation-secrets
  local-objects:
    name: tabtin-community-local-objects
